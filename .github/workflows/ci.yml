name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查 + 单元测试（Windows / Node 20）
    runs-on: windows-latest
    env:
      # 只做类型检查与单测，不需要下载 Electron 二进制（省 CI 时间）
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（tsc --noEmit）
        run: pnpm typecheck

      - name: 单元测试（209 例）
        run: pnpm test
